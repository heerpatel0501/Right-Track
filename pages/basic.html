<!DOCTYPE html>
<html>
<head>
    <title>Basic Info - Right Track</title>
    <link rel="stylesheet" href="../css/basic.css">
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">
        <img src="../images/logo.png" class="logo">
        <h1>Basic information</h1>
        <p>Enter your date of birth and gender</p>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="dob-row">
            <input type="text" placeholder="Day">
            
            <select>
                <option>Month</option>
                <option>Jan</option>
                <option>Feb</option>
                <option>Mar</option>
                <option>Apr</option>
                <option>May</option>
                <option>Jun</option>
                <option>Jul</option>
                <option>Aug</option>
                <option>Sep</option>
                <option>Oct</option>
                <option>Nov</option>
                <option>Dec</option>
            </select>

            <input type="text" placeholder="Year">
        </div>
        
        <select class="gender">
            <option>Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        

        <a href="signup-step2.html">
            <button class="next-btn">Next</button>
        </a>

    </div>

</div>

</body>
</html>
