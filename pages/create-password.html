<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Password - Right Track</title>
<link rel="stylesheet" href="../css/create-password.css">
</head>

<body>

<div class="main-box">

    <!-- LEFT -->
    <div class="left">
        <img src="../images/logo.png">
        <h2>Create Password</h2>
        <p>Use at least 6 characters for a strong password</p>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <input type="password" id="password" placeholder="Enter Password" class="input-box">
        <input type="password" id="confirm" placeholder="Confirm Password" class="input-box">

        <p id="error" class="error"></p>

        <button onclick="checkPassword()" class="btn">Create Account</button>

    </div>

</div>

<script src="../js/create-password.js"></script>

</body>
</html>
