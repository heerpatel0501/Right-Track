<!DOCTYPE html>
<html>
<head>
<title>Password - Right Track</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f4f4f7, #c5e2ff);

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* MAIN BOX */
.main-box {
    width: 680px;
    height: 250px;
    max-width: 95%;
    background: white;
    border-radius: 12px;
    padding: 40px;
    display: flex;
    justify-content: space-between;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

/* LEFT SIDE */
.left {
    width: 48%;
    display: flex;
    flex-direction: column;
}

.left h2 {
    margin-top: 10px;   /* reduce space above text */
}

.profile {
    margin-top: 10px;   /* tighten spacing */
}
.profile {
    display: flex;
    align-items: center;
    gap: 10px;
    /* margin-top: 1px; */
}

.profile img {
    width: 30px;
    border-radius: 50%;
}

.profile span {
    font-size: 14px;
    background: #eee;
    padding: 5px 10px;
    border-radius: 20px;
}

/* RIGHT SIDE */
.right {
    width: 48%;
}

.input-box {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-top: 20px;
}

.actions {
    margin-top: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.link {
    color: #1a73e8;
    text-decoration: none;
    font-size: 13px;
}

.next-btn {
    background: #1a73e8;
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 20px;
    cursor: pointer;
}

.next-btn:hover {
    background: #0f3b71;
}
</style>
</head>

<body>

<div class="main-box">

<!-- LEFT -->
<div class="left">

    <img src="{{ url_for('static', filename='images/logo.png') }}" width="46">

    <h2>Hi {{ username }}</h2>

    <div class="profile">
        <img src="{{ url_for('static', filename='images/profile.png') }}">
        <span>{{ username }}@gmail.com</span>
    </div>

</div>

<!-- RIGHT -->
<div class="right">

    <p>To continue, first verify it’s you</p>

    <input type="password" class="input-box" placeholder="Enter your password">

    <div style="margin-top:10px;">
        <input type="checkbox"> Show password
    </div>

    <div class="actions">
        <a href="#" class="link">Forgot password?</a>

        <a href="/dashboard">
            <button class="next-btn">Next</button>
        </a>
    </div>

</div>

</div>

</body>
</html>
