<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

</head>

<body>

<nav class="navbar">

<div class="nav-left">

<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">

<span class="brand">Right Track</span>

</div>

<div class="nav-right">

<a href="/">Home</a>

</div>

</nav>


<div class="dashboard">

<h2>Welcome Back, {{ username }} 👋</h2>

<div class="progress-layout">

<div class="circle-box">

<div class="circle"
style="background: conic-gradient(#6c63ff 0%, #6c63ff {{ overall }}%, #e6e6e6 {{ overall }}%, #e6e6e6 100%);">

<div class="inner-circle">

<h3>{{ overall }}%</h3>

<p>Overall</p>

</div>

</div>

</div>


<div class="details-box">

<div class="progress-item">
<span>Skills</span>
<span>{{ skills }}%</span>
</div>

<div class="progress-item">
<span>Health</span>
<span>{{ health }}%</span>
</div>

<div class="progress-item">
<span>Finance</span>
<span>{{ finance }}%</span>
</div>

</div>

</div>

</div>


<div class="weekly-section">

<h3>Weekly Activity</h3>

<div class="bars">

{% for day in weekly_data %}

<div class="bar">

<div class="fill" style="height: {{ day.value }}%;"></div>

<span>{{ day.label }}</span>

</div>

{% endfor %}

</div>

</div>


<div class="ai-section">

<h3>Recommended For You</h3>

<div class="ai-card">

<h4>Top News</h4>

<p>{{ ai_news }}</p>

</div>

<div class="ai-card">

<h4>Recommended Video</h4>

<p>{{ ai_video }}</p>

</div>

</div>

</body>

</html>
